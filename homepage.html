<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>

  <link rel="stylesheet" href="homepage_style.css">

<body>
  <div class="content-container">
   <div class="my-to-do-app">
   <h1>My To-do List <img src="images/icon.png" alt="to-do-list-icon"></h1>
   <div class="row">
    <input type="text" id="inputElement" placeholder="Add an item (max 50 chars)">
    <small id="error" style="color: red; display: none;"></small>
    <small id="counter"></small>
    <button onclick="addTask()">Add</button>
   </div>
   <ul id="list-container">
   </ul>
   </div>
  </div>
  <script src="list-functionality.js"></script>
</body>
</html>
