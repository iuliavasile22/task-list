<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task List App</title>

  <link rel="stylesheet" href="task_list_style.css">

<body>
  <div class="content-container">
   <div class="my-task-list-app">
   <h1>My Task List <img src="images/checklist.png" alt="task_list"></h1>
   <div class="row">
    <input type="text" id="inputElement" placeholder="Add an item (max 50 chars)">

    <small id="error-message"></small>
    <small id="counter"></small>
    
    <button onclick="addTask()">Add</button>
   </div>
   <ul id="list-container">
   </ul>
   </div>
  </div>
  <script src="task_list_functionality.js"></script>
</body>
</html>
